    </div>
    <button id="zones-toggle" class="ghost" type="button"

  <aside id="cardpanel" class="card-panel" hidden></aside>
</div>
<script>
/* Load the build's app.js even when a tablet browser cached the old one.
   version.json is fetched no-store; file:// falls back to a classic script. */
(function () {
  var base = document.body.dataset.base || "";
  var isHttp = /^https?:$/.test(location.protocol);
  function load(build) {
    window.PLAY_BUILD = build || "";
    var css = document.getElementById("play-style");
    if (css && build) css.href = base + "assets/style.css?v=" + encodeURIComponent(build);
    var s = document.createElement("script");
    s.src = base + "assets/app.js" + (build ? "?v=" + encodeURIComponent(build) : "");
    document.body.appendChild(s);
  }
  if (!isHttp || typeof fetch !== "function") { load(""); return; }
  fetch(base + "version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { load(j && j.build ? j.build : ""); })
    .catch(function () { load(""); });
})();
</script>
</body>
